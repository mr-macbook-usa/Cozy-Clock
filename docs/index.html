<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Hearth Clock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,400&display=swap">
<style>
/* Layout: one-screen clock. Date pill on top, one big glass slab with the time in the middle, a glass dock at the bottom. Dark first, committed single look. */
:root {
  --ink: #0d0b14;
  --text: #f6f1ff;
  --muted: rgba(246, 241, 255, 0.66);
  --glass-hi: rgba(255, 255, 255, 0.17);
  --glass-lo: rgba(255, 255, 255, 0.045);
  --edge: rgba(255, 255, 255, 0.34);
  --accent: #ffc08a;
  --font-ui: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --font-soft: "Fraunces", "New York", Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-ui);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

[data-palette="dusk"]  { --a: #3a2470; --b: #120f26; --c: #5a2a5c; --accent: #ffc08a; }
[data-palette="ember"] { --a: #6a2a1f; --b: #190d10; --c: #7a3d1c; --accent: #ffb067; }
[data-palette="moss"]  { --a: #1f5440; --b: #09140f; --c: #34603f; --accent: #c6e8a4; }
[data-palette="tide"]  { --a: #1d4673; --b: #08101e; --c: #1f6068; --accent: #92dcea; }
[data-palette="cocoa"] { --a: #54382b; --b: #120c0a; --c: #6b4630; --accent: #f4d3a2; }

.bg, .bg-img, .scrim, .dim { position: fixed; inset: 0; }
.bg {
  background:
    radial-gradient(120% 80% at 15% 8%, var(--a), transparent 62%),
    radial-gradient(110% 75% at 88% 92%, var(--c), transparent 62%),
    var(--b);
  overflow: hidden;
}
.orb {
  position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.55;
  animation: drift 28s ease-in-out infinite alternate;
}
.orb.one { width: 62vmax; height: 62vmax; left: -22vmax; top: 8%; background: var(--a); }
.orb.two { width: 54vmax; height: 54vmax; right: -24vmax; bottom: -6%; background: var(--c); animation-duration: 36s; animation-direction: alternate-reverse; }
@keyframes drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(10vmax, -6vmax, 0) scale(1.18); } }
.bg-img { background-size: cover; background-position: center; opacity: 0; transition: opacity 0.6s ease; }
.has-img .bg-img { opacity: 1; }
.scrim { background: linear-gradient(180deg, rgba(9, 7, 16, 0.28), rgba(9, 7, 16, 0.5)); opacity: 0; transition: opacity 0.6s ease; pointer-events: none; }
.has-img .scrim { opacity: 1; }
.dim { background: #000; opacity: 0; transition: opacity 0.5s ease; pointer-events: none; z-index: 5; }
.is-dim .dim { opacity: 0.5; }

.app {
  position: relative; z-index: 1; height: 100%;
  display: flex; flex-direction: column; justify-content: space-between; align-items: center;
  gap: 16px; max-width: 520px; margin: 0 auto;
}

.glass {
  position: relative; overflow: hidden;
  background: linear-gradient(150deg, var(--glass-hi), var(--glass-lo));
  -webkit-backdrop-filter: blur(26px) saturate(180%);
  backdrop-filter: blur(26px) saturate(180%);
  box-shadow:
    inset 0 1.5px 0 var(--edge),
    inset 0 -1px 0 rgba(255, 255, 255, 0.07),
    inset 0 0 0 1px rgba(255, 255, 255, 0.09),
    0 22px 50px rgba(0, 0, 0, 0.34);
}
.glass::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(90% 60% at 12% -6%, rgba(255, 255, 255, 0.26), transparent 60%),
    radial-gradient(60% 40% at 100% 110%, rgba(255, 255, 255, 0.1), transparent 70%);
}
.glass > * { position: relative; }

.date {
  margin-top: 6px; padding: 10px 20px; border-radius: 999px;
  font-size: 0.95rem; font-weight: 600; letter-spacing: 0.02em; color: var(--text);
}

.slab {
  width: 100%; box-sizing: border-box; border-radius: 44px;
  padding: 34px 22px 26px; text-align: center;
}
.hello { font-family: var(--font-soft); font-style: italic; font-weight: 300; font-size: 1.35rem; color: var(--accent); margin: 0 0 6px; text-wrap: balance; }
.time { display: flex; justify-content: center; align-items: flex-end; gap: 10px; font-variant-numeric: tabular-nums; line-height: 0.95; }
#hm { font-size: clamp(4.6rem, 25vw, 8.6rem); font-weight: 300; letter-spacing: -0.03em; text-shadow: 0 6px 30px rgba(0, 0, 0, 0.3); }
.side { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding-bottom: 0.9rem; font-variant-numeric: tabular-nums; }
#sec { font-size: clamp(1.4rem, 7vw, 2.3rem); font-weight: 300; color: var(--muted); }
#ap { font-size: 1rem; font-weight: 700; letter-spacing: 0.12em; color: var(--accent); }
.tick { margin: 22px auto 0; height: 6px; width: 78%; border-radius: 99px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
.tick i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--accent); box-shadow: 0 0 14px var(--accent); }

.dock { width: 100%; box-sizing: border-box; border-radius: 34px; padding: 8px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 4px; }
.dock button {
  appearance: none; border: 0; background: transparent; color: var(--muted);
  font: inherit; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.03em;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 4px 10px; border-radius: 26px; cursor: pointer; transition: background 0.2s, color 0.2s;
}
.dock button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.dock button[aria-pressed="true"] { color: var(--accent); background: rgba(255, 255, 255, 0.13); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3); }
button:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

.sheet-wrap { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(5, 4, 10, 0.5); }
.sheet {
  width: 100%; max-width: 520px; box-sizing: border-box; border-radius: 40px 40px 0 0;
  padding: 22px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  animation: rise 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
}
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.sheet h2 { margin: 0; font-size: 1.15rem; font-weight: 700; }
.close { appearance: none; border: 0; border-radius: 99px; padding: 8px 16px; font: inherit; font-weight: 700; font-size: 0.85rem; color: var(--text); background: rgba(255, 255, 255, 0.14); cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tile {
  position: relative; aspect-ratio: 1 / 1.1; border-radius: 22px; border: 0; padding: 0; cursor: pointer; color: var(--text);
  font: inherit; font-size: 0.78rem; font-weight: 700; overflow: hidden;
  display: flex; align-items: flex-end; justify-content: flex-start;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
  background:
    radial-gradient(120% 90% at 15% 5%, var(--a), transparent 62%),
    radial-gradient(110% 80% at 90% 95%, var(--c), transparent 62%),
    var(--b);
}
.tile span { padding: 10px 12px; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6); }
.tile[aria-pressed="true"] { box-shadow: inset 0 0 0 2.5px var(--accent); }
.tile.upload { background-size: cover; background-position: center; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background-color: rgba(255, 255, 255, 0.08); background-image: none; }
.tile.upload svg { width: 26px; height: 26px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; }
.tile.upload.has { align-items: flex-end; justify-content: flex-start; flex-direction: row; }
.tile.upload.has svg { display: none; }
input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.remove { margin-top: 14px; appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 0.85rem; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 6px 2px; }
.note { margin: 12px 0 0; font-size: 0.8rem; color: var(--muted); }

.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translateX(-50%); z-index: 30; padding: 10px 18px; border-radius: 99px; font-size: 0.85rem; font-weight: 600; max-width: 88vw; text-align: center; }

/* Sun: shown 7 AM to 6 PM, drifting left to right in an arc */
.sun { position: fixed; left: 12%; top: 30%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; pointer-events: none; opacity: 0; background: radial-gradient(circle at 38% 36%, #fff6d6, #ffd98a 45%, #ffb347 100%); box-shadow: 0 0 50px 20px rgba(255, 190, 90, 0.45), 0 0 140px 70px rgba(255, 170, 70, 0.2); transition: left 1.2s ease, top 1.2s ease, opacity 1.4s ease; }
.sun.on { opacity: 0.95; }
.zen .sun.on { opacity: 0.72; }
/* Moon: shown the rest of the time (6 PM to 7 AM), same left to right arc */
.moon { position: fixed; left: 12%; top: 30%; width: 78px; height: 78px; margin: -39px 0 0 -39px; border-radius: 50%; pointer-events: none; opacity: 0;
  background:
    radial-gradient(circle at 62% 30%, rgba(160, 164, 172, 0.45) 0 7%, transparent 8%),
    radial-gradient(circle at 34% 58%, rgba(160, 164, 172, 0.4) 0 10%, transparent 11%),
    radial-gradient(circle at 66% 70%, rgba(160, 164, 172, 0.35) 0 6%, transparent 7%),
    radial-gradient(circle at 38% 34%, #fffdf2, #e9e7dc 58%, #c4c6c8 100%);
  box-shadow: 0 0 40px 14px rgba(200, 214, 255, 0.28), 0 0 120px 56px rgba(150, 175, 255, 0.14);
  transition: left 1.2s ease, top 1.2s ease, opacity 1.4s ease; }
.moon.on { opacity: 0.92; }
.zen .moon.on { opacity: 0.7; }
.moon { background: none; box-shadow: none; }
.moon svg { display: block; overflow: visible; filter: drop-shadow(0 0 calc(10px + 26px * var(--glow, 1)) rgba(200, 214, 255, calc(0.12 + 0.4 * var(--glow, 1)))); }
[hidden] { display: none !important; }
.day-sky .scrim { opacity: 0.3; }
.tile.sky { background-size: cover; background-position: center; }
/* Zen mode */
@property --a { syntax: "<color>"; inherits: true; initial-value: #000000; }
@property --b { syntax: "<color>"; inherits: true; initial-value: #000000; }
@property --c { syntax: "<color>"; inherits: true; initial-value: #000000; }
@property --accent { syntax: "<color>"; inherits: true; initial-value: #ffc08a; }
#app { transition: --a 1.4s ease, --b 1.4s ease, --c 1.4s ease, --accent 1.4s ease; }
[data-palette="zen"] { --a: #4d6b5b; --b: #0e1411; --c: #7a6a48; --accent: #ecdcb8; }
.topbar { width: 100%; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-top: 6px; }
.topbar .date { margin-top: 0; min-width: 0; text-align: right; }
.top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 0; }
.phase { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px 5px 7px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.01em; color: var(--muted); white-space: nowrap; }
.phase svg { width: 16px; height: 16px; flex: none; }
.zen-btn { appearance: none; border: 0; display: flex; align-items: center; gap: 8px; padding: 10px 18px 10px 14px; border-radius: 999px; color: var(--text); font: inherit; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: color 0.6s; }
.zen-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.zen-btn[aria-pressed="true"] { color: var(--accent); }
.stage { position: relative; width: 100%; }
.pup { position: absolute; right: 24px; bottom: calc(100% - 6px); width: min(190px, 46vw); height: auto; overflow: visible; z-index: 3; pointer-events: none; opacity: 0; transform: translateY(14px) scale(0.96); transition: opacity 1s ease 0.3s, transform 1s ease 0.3s; }
.zen .pup { opacity: 1; transform: none; }
.pup-breath { transform-origin: 70px 106px; animation: puppyBreath 4s ease-in-out infinite; }
@keyframes puppyBreath { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1, 1.035); } }
.pup .z { font-family: var(--font-soft); font-style: italic; fill: var(--accent); opacity: 0; animation: zfloat 5.5s ease-in-out infinite; }
.pup .z2 { animation-delay: 1.8s; }
.pup .z3 { animation-delay: 3.6s; }
@keyframes zfloat { 0% { opacity: 0; transform: translate(0, 6px); } 25% { opacity: 0.9; } 100% { opacity: 0; transform: translate(10px, -22px); } }
.slab::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 1.5px var(--accent); opacity: 0; transition: opacity 1s ease; }
.zen .slab::after { opacity: 0.5; animation: ring 8s ease-in-out infinite; }
@keyframes ring { 0%, 100% { opacity: 0.22; } 50% { opacity: 0.8; } }
.breath { display: none; margin: 30px auto 14px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 24px var(--accent); animation: breathe 8s ease-in-out infinite; }
.zen .breath { display: block; }
.zen .tick { display: none; }
@keyframes breathe { 0%, 100% { transform: scale(0.7); opacity: 0.55; } 50% { transform: scale(2.3); opacity: 1; } }
.zen #hm { font-weight: 200; letter-spacing: 0.01em; }
.zen .orb.one { animation-duration: 70s; }
.zen .orb.two { animation-duration: 90s; }
.dock { transition: opacity 0.7s ease, transform 0.7s ease; }
.zen .dock { opacity: 0; transform: translateY(24px); pointer-events: none; }
#app.zen .scrim { background: linear-gradient(180deg, rgba(8, 12, 10, 0.45), rgba(8, 12, 10, 0.62)); }
@media (prefers-reduced-motion: reduce) { .zen .slab::after, .breath, .pup-breath, .pup .z { animation: none; } .breath { transform: scale(1.4); } .pup, .dock, #app { transition: none; } }
@media (max-height: 640px) { .slab { padding-block: 20px 16px; } .tick { margin-top: 14px; } }
@media (prefers-reduced-motion: reduce) { .orb, .sheet { animation: none; } .bg-img, .scrim, .dim { transition: none; } }
</style>

<div class="app" id="app" data-palette="dusk">
  <div class="bg" aria-hidden="true"><div class="orb one"></div><div class="orb two"></div></div>
  <div class="bg-img" id="bgimg" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>
  <div class="sun" id="sun" aria-hidden="true"></div>
  <div class="moon" id="moon" role="img" aria-label="Moon">
    <svg viewBox="0 0 78 78" width="78" height="78" aria-hidden="true">
      <defs>
        <radialGradient id="mg" cx="0.38" cy="0.34" r="0.7"><stop offset="0" stop-color="#fffdf2"/><stop offset="0.58" stop-color="#e9e7dc"/><stop offset="1" stop-color="#c4c6c8"/></radialGradient>

      </defs>
      <circle cx="39" cy="39" r="39" fill="#8fa0c8" opacity="0.16"/>
      <path id="moonlit" fill="url(#mg)" d=""/>
      <g clip-path="url(#moonclipdef)" fill="#a0a4ac"><circle cx="50" cy="21" r="6" opacity="0.42"/><circle cx="26" cy="45" r="8" opacity="0.38"/><circle cx="51" cy="55" r="4.5" opacity="0.32"/></g>
    </svg>
  </div>
  <div class="dim" aria-hidden="true"></div>

  <div class="topbar">
    <button type="button" class="glass zen-btn" id="zenbtn" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14"/><path d="M5 19c2-4 5-7 9-9"/></svg>Zen
    </button>
    <div class="top-right">
      <div class="glass date" id="date">Saturday, November 21</div>
      <div class="glass phase" id="phase" role="img" aria-label="Moon phase">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="#8fa0c8" opacity="0.3"/><path id="phaselit" fill="#f4f1e6" d=""/></svg>
        <span id="phasetext" aria-hidden="true"></span>
      </div>
    </div>
  </div>

  <div class="stage">

      <ellipse cx="48" cy="88" rx="26" ry="17" fill="#efbb63"/>

      <ellipse cx="112" cy="72" rx="10" ry="21" transform="rotate(18 112 72)" fill="#c98a36"/>
      <ellipse cx="164" cy="72" rx="10" ry="21" transform="rotate(-18 164 72)" fill="#c98a36"/>
      <ellipse cx="138" cy="82" rx="16" ry="11" fill="#f7dca4"/>
      <circle cx="120" cy="78" r="4.5" fill="#ff9a9a" opacity="0.35"/>
      <circle cx="156" cy="78" r="4.5" fill="#ff9a9a" opacity="0.35"/>
      <ellipse cx="138" cy="90" rx="3.6" ry="4.2" fill="#f08a8f"/>

  <main class="glass slab" aria-live="off">

<div class="sheet-wrap" id="sheetwrap" hidden>
  <section class="glass sheet" role="dialog" aria-modal="true" aria-labelledby="sheettitle">
    <div class="sheet-head">
      <h2 id="sheettitle">Backgrounds</h2>
      <button type="button" class="close" id="close">Done</button>
    </div>
    <div class="grid" id="grid">
      <button type="button" class="tile sky" id="skytile" aria-pressed="true"><span>Sky</span></button>
      <button type="button" class="tile" data-palette="dusk" data-pick="dusk"><span>Dusk</span></button>
      <button type="button" class="tile" data-palette="ember" data-pick="ember"><span>Ember</span></button>
      <button type="button" class="tile" data-palette="moss" data-pick="moss"><span>Moss</span></button>
      <button type="button" class="tile" data-palette="tide" data-pick="tide"><span>Tide</span></button>
      <button type="button" class="tile" data-palette="cocoa" data-pick="cocoa"><span>Cocoa</span></button>
      <label class="tile upload" id="uptile" for="file">
        <svg viewBox="0 0 24 24"><path d="M12 16V5M7.5 9.5L12 5l4.5 4.5M5 19h14"/></svg>
        <span id="uplabel">Your photo</span>
        <input type="file" id="file" accept="image/*">

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app");
  var state = { palette: "dusk", hour12: true, seconds: true, dim: false, photo: false, zen: false, auto: true };
  var SKY = window.HEARTH_SKY || { day: "", night: "" };
  var lastDay = null;
  var photoData = null;

  function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function save(key, val) { try { localStorage.setItem(key, val); return true; } catch (e) { return false; } }
  function drop(key) { try { localStorage.removeItem(key); } catch (e) {} }

  try {
    var s = JSON.parse(load("hearth-settings") || "null");
    if (s) { state.palette = s.palette || "dusk"; state.hour12 = s.hour12 !== false; state.seconds = s.seconds !== false; state.dim = !!s.dim; state.zen = !!s.zen; state.auto = s.auto !== false; }
  } catch (e) {}
  photoData = load("hearth-photo");
  state.photo = !!photoData;

  function persist() {
    save("hearth-settings", JSON.stringify({ palette: state.palette, hour12: state.hour12, seconds: state.seconds, dim: state.dim, zen: state.zen, auto: state.auto }));
  }

  var toastTimer;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
  }

  function render() {
    app.dataset.palette = state.zen ? "zen" : state.palette;
    app.classList.toggle("zen", state.zen);
    $("zenbtn").setAttribute("aria-pressed", String(state.zen));
    syncBreath();
    document.body.classList.toggle("has-img", state.photo || state.auto);
    document.body.classList.toggle("is-dim", state.dim);
    var skyUrl = skyImage();
    $("bgimg").style.backgroundImage = state.photo && photoData ? "url(" + photoData + ")" : state.auto ? "url(" + skyUrl + ")" : "none";
    document.body.classList.toggle("day-sky", state.auto && !state.photo && skyUrl === SKY.day);
    var st = $("skytile");
    st.style.backgroundImage = "url(" + skyUrl + ")";
    st.setAttribute("aria-pressed", String(state.auto && !state.photo));
    $("b-fmt").setAttribute("aria-pressed", String(!state.hour12));
    $("fmtlabel").textContent = state.hour12 ? "12-hour" : "24-hour";
    $("b-sec").setAttribute("aria-pressed", String(state.seconds));
    $("b-dim").setAttribute("aria-pressed", String(state.dim));
    $("sec").hidden = !state.seconds || state.zen;
    $("tickwrap").hidden = !state.seconds;
    $("ap").hidden = !state.hour12;
    var tiles = document.querySelectorAll("[data-pick]");
    for (var i = 0; i < tiles.length; i++) {
      tiles[i].setAttribute("aria-pressed", String(!state.photo && !state.auto && tiles[i].dataset.pick === state.palette));
    }
    var up = $("uptile");
    up.classList.toggle("has", state.photo);
    up.style.backgroundImage = state.photo && photoData ? "url(" + photoData + ")" : "none";
    up.setAttribute("aria-pressed", String(state.photo));
    $("uplabel").textContent = state.photo ? "Your photo" : "Add photo";
    $("remove").hidden = !state.photo;
    showSunTimes();
    tick(true);
  }

  var last = "";
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function tick(force) {
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes(), sc = d.getSeconds();
    var disp = state.hour12 ? (h % 12 || 12) : pad(h);
    var key = disp + ":" + pad(m) + ":" + pad(sc) + state.hour12 + state.seconds;
    if (!force && key === last) return;
    last = key;
    $("hm").textContent = disp + ":" + pad(m);
    $("sec").textContent = ":" + pad(sc);
    $("ap").textContent = h < 12 ? "AM" : "PM";
    $("tick").style.width = ((sc + d.getMilliseconds() / 1000) / 60 * 100).toFixed(1) + "%";
    $("date").textContent = d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    var g = h < 5 ? "Burning the midnight oil" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : h < 21 ? "Good evening" : "Time to wind down";
    if (state.zen) { g = (Date.now() % 8000) < 4000 ? "Breathe in" : "Breathe out"; }
    $("hello").textContent = g;
    showPhase(d);
    var sk = sky(d), sunUp = sk.day, sun = $("sun");
    sun.classList.toggle("on", sunUp);
    if (sunUp !== lastDay) {
      lastDay = sunUp;
      document.body.classList.toggle("day-sky", state.auto && !state.photo && sunUp);
      if (state.auto && !state.photo) {
        $("bgimg").style.backgroundImage = "url(" + (sunUp ? SKY.day : SKY.night) + ")";
        $("skytile").style.backgroundImage = "url(" + (sunUp ? SKY.day : SKY.night) + ")";
      }
    }
    var moon = $("moon");
    moon.classList.toggle("on", !sunUp);
    if (!sunUp) {
      drawMoon(d);
      var q = sk.progress;
      moon.style.left = (12 + 76 * q).toFixed(2) + "%";
      moon.style.top = (30 - 20 * Math.sin(Math.PI * q)).toFixed(2) + "%";
    }
    if (sunUp) {
      var p = sk.progress;
      sun.style.left = (12 + 76 * p).toFixed(2) + "%";
      sun.style.top = (30 - 20 * Math.sin(Math.PI * p)).toFixed(2) + "%";
    }
  }
  setInterval(function () { tick(false); }, 250);

  function openSheet() { $("sheetwrap").hidden = false; $("b-bg").setAttribute("aria-pressed", "true"); $("close").focus(); }
  function closeSheet() { $("sheetwrap").hidden = true; $("b-bg").setAttribute("aria-pressed", "false"); $("b-bg").focus(); }
  $("b-bg").addEventListener("click", openSheet);
  $("close").addEventListener("click", closeSheet);
  $("sheetwrap").addEventListener("click", function (e) { if (e.target === $("sheetwrap")) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("sheetwrap").hidden) closeSheet(); });

  // Moon phase: 0 = new, 0.5 = full. Reference new moon 2000-01-06 18:14 UTC, synodic month 29.53059 days.
  function moonPhase(date) {
    var syn = 29.530588853, days = (date.getTime() - Date.UTC(2000, 0, 6, 18, 14)) / 86400000;
    return (((days % syn) + syn) % syn) / syn;
  }
  function moonName(p) {
    if (p < 0.03 || p > 0.97) return "New Moon";
    if (p < 0.22) return "Waxing Crescent";
    if (p < 0.28) return "First Quarter";
    if (p < 0.47) return "Waxing Gibbous";
    if (p < 0.53) return "Full Moon";
    if (p < 0.72) return "Waning Gibbous";
    if (p < 0.78) return "Last Quarter";
    return "Waning Crescent";
  }
  // SVG path of the lit part of a moon of radius r centred at (c, c).
  function moonPath(p, r, c) {
    var k = Math.cos(2 * Math.PI * p), waxing = p < 0.5;
    var rx = (Math.abs(k) * r).toFixed(2);
    var limb = waxing ? 1 : 0, term = (waxing === (k < 0)) ? 1 : 0;
    return "M" + c + " " + (c - r) + " A" + r + " " + r + " 0 0 " + limb + " " + c + " " + (c + r) +
           " A" + rx + " " + r + " 0 0 " + term + " " + c + " " + (c - r) + " Z";
  }
  // The moon phase pill under the date: tiny moon, phase name, and how much of it is lit.
  var lastPhaseKey = "";
  function showPhase(date) {
    var p = moonPhase(date), name = moonName(p);
    var lit = Math.round((1 - Math.cos(2 * Math.PI * p)) / 2 * 100);
    var key = name + lit;
    if (key === lastPhaseKey) return;
    lastPhaseKey = key;
    $("phaselit").setAttribute("d", moonPath(p, 7, 8));
    $("phasetext").textContent = name + " \u00b7 " + lit + "%";
    $("phase").setAttribute("aria-label", "Moon phase: " + name + ", " + lit + "% lit");
  }
  function drawMoon(date) {
    var p = moonPhase(date), k = Math.cos(2 * Math.PI * p);
    var d = moonPath(p, 39, 39);
    $("moonlit").setAttribute("d", d);
    $("moonclip").setAttribute("d", d);
    var el = $("moon");
    el.style.setProperty("--glow", ((1 - k) / 2).toFixed(2));
    el.setAttribute("aria-label", moonName(p));
  }
  // Real sunrise and sunset for a local calendar day (NOAA sunrise equation, about a minute of accuracy).
  // Returns {rise, set} in ms, or {polar: "day"|"night"} when the sun never sets or never rises.
  function sunEvents(day, lat, lon) {
    var R = Math.PI / 180;
    var noon = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 12);
    var jd = noon.getTime() / 86400000 + 2440587.5;
    var js = Math.round(jd - 2451545 + lon / 360) - lon / 360;
    var M = ((357.5291 + 0.98560028 * js) % 360) * R;
    var C = 1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M);
    var L = ((M / R + C + 180 + 102.9372) % 360) * R;
    var jt = 2451545 + js + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
    var sd = Math.sin(L) * Math.sin(23.4397 * R), cd = Math.cos(Math.asin(sd));
    var cw = (Math.sin(-0.833 * R) - Math.sin(lat * R) * sd) / (Math.cos(lat * R) * cd);
    if (cw < -1) return { polar: "day" };
    if (cw > 1) return { polar: "night" };
    var w = Math.acos(cw) / R / 360;
    return { rise: (jt - w - 2440587.5) * 86400000, set: (jt + w - 2440587.5) * 86400000 };
  }
  // Your rough location (2 decimal places, about 1 km), kept only in this browser.
  var place = null;
  try { place = JSON.parse(load("hearth-place") || "null"); } catch (e) {}
  var locDenied = false;
  function locate() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function (pos) {
      var c = pos.coords;
      place = { lat: Math.round(c.latitude * 100) / 100, lon: Math.round(c.longitude * 100) / 100 };
      locDenied = false; eventCache = {}; lastDay = null;
      save("hearth-place", JSON.stringify(place));
      render();
    }, function (err) {
      if (err && err.code === 1) { locDenied = true; showSunTimes(); }
    }, { enableHighAccuracy: false, maximumAge: 6 * 3600 * 1000, timeout: 20000 });
  }
  // Sunrise and sunset for a day: the real ones when we know where you are, otherwise 7 AM and 6 PM.
  var eventCache = {};
  function eventsFor(day) {
    var key = day.getFullYear() + "-" + day.getMonth() + "-" + day.getDate() + (place ? "@" + place.lat + "," + place.lon : "");
    if (eventCache[key]) return eventCache[key];
    var e = place ? sunEvents(day, place.lat, place.lon)
      : { rise: new Date(day.getFullYear(), day.getMonth(), day.getDate(), 7).getTime(),
          set: new Date(day.getFullYear(), day.getMonth(), day.getDate(), 18).getTime() };
    return (eventCache[key] = e);
  }
  function dayStart(d, offset) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + (offset || 0)); }
  // Where we are in the sky right now: day or night, and how far (0 to 1) across the sun's or moon's arc.
  function sky(now) {
    var t = now.getTime(), today = dayStart(now), e = eventsFor(today);
    var start = today.getTime(), end = dayStart(now, 1).getTime();
    var clamp = function (x) { return Math.min(1, Math.max(0, x)); };
    if (e.polar) return { day: e.polar === "day", progress: clamp((t - start) / (end - start)) };
    if (t >= e.rise && t < e.set) return { day: true, progress: clamp((t - e.rise) / (e.set - e.rise)) };
    var from, to;
    if (t >= e.set) { var n = eventsFor(dayStart(now, 1)); from = e.set; to = n.rise || dayStart(now, 2).getTime(); }
    else { var p = eventsFor(dayStart(now, -1)); from = p.set || start; to = e.rise; }
    return { day: false, progress: clamp((t - from) / (to - from)) };
  }
  function fmtTime(ms) {
    return new Date(ms).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit", hour12: state.hour12 });
  }
  function showSunTimes() {
    var el = $("suntimes"), btn = $("locbtn"), e = eventsFor(dayStart(new Date()));
    if (!place) {
      el.textContent = locDenied
        ? "Location is off, so the sun and sky follow 7 AM to 6 PM. Allow location in your browser settings to match your real sunrise and sunset."
        : "The sun and sky follow 7 AM to 6 PM until you share your location.";
      btn.hidden = !navigator.geolocation || locDenied;
      return;
    }
    btn.hidden = true;
    el.textContent = e.polar === "day" ? "The sun stays up all day today where you are."
      : e.polar === "night" ? "The sun stays down all day today where you are."
      : "Sunrise " + fmtTime(e.rise) + " \u00b7 Sunset " + fmtTime(e.set) + " today, based on your location.";
  }
  $("locbtn").addEventListener("click", locate);
  // Default background: the day sky between sunrise and sunset, the night sky the rest of the time.
  function skyImage() {
    return sky(new Date()).day ? SKY.day : SKY.night;
  }
  $("skytile").addEventListener("click", function () {
    state.auto = true; state.photo = false; persist(); render();
  });
  function syncBreath() {
    var b = document.querySelector(".breath");
    if (b) b.style.animationDelay = "-" + ((Date.now() % 8000) / 1000).toFixed(2) + "s";
  }
  $("zenbtn").addEventListener("click", function () {
    state.zen = !state.zen;
    persist(); render();
    toast(state.zen ? "Zen mode on" : "Zen mode off");
  });
  $("b-fmt").addEventListener("click", function () { state.hour12 = !state.hour12; persist(); render(); });
  $("b-sec").addEventListener("click", function () { state.seconds = !state.seconds; persist(); render(); });
  $("b-dim").addEventListener("click", function () { state.dim = !state.dim; persist(); render(); });

  $("grid").addEventListener("click", function (e) {
    var t = e.target.closest("[data-pick]");
    if (!t) return;
    state.palette = t.dataset.pick; state.photo = false; state.auto = false; persist(); render();
  });

  $("remove").addEventListener("click", function () {
    photoData = null; state.photo = false; state.auto = true; persist(); drop("hearth-photo"); render(); toast("Photo removed");
  });

  $("file").addEventListener("change", function () {
    var f = this.files && this.files[0];
    if (!f) return;
    if (f.type && f.type.indexOf("image/") !== 0) { toast("Pick an image file"); return; }
    var reader = new FileReader();
    reader.onerror = function () { toast("Couldn't read that photo"); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { toast("Couldn't open that image"); };
      img.onload = function () {
        var max = 1600, w = img.naturalWidth, h = img.naturalHeight;
        var k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        photoData = c.toDataURL("image/jpeg", 0.82);
        state.photo = true; state.auto = false; persist();
        var saved = save("hearth-photo", photoData);
        render();
        toast(saved ? "Background set" : "Background set for this visit only");
        closeSheet();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
    this.value = "";
  });

  var lock = null;
  function wake() {
    try {
      if (navigator.wakeLock && document.visibilityState === "visible") {
        navigator.wakeLock.request("screen").then(function (l) { lock = l; }, function () {});
      }
    } catch (e) {}
  }
  document.addEventListener("visibilitychange", wake);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { eventCache = {}; locate(); }
  });
  locate();
  wake();

  render();
})();
</script>

</body></html>
